<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Collection — Neural Network Skill Map</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0e17;
  color: #c8d6e5;
  font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
  overflow: hidden;
  height: 100vh;
}

#app {
  display: flex;
  height: 100vh;
}

/* ---------- Sidebar ---------- */
#sidebar {
  width: 300px;
  min-width: 300px;
  background: #0d1320;
  border-right: 1px solid #1a2332;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#sidebar-header {
  padding: 18px 20px 12px;
  border-bottom: 1px solid #1a2332;
}

#sidebar-header h1 {
  font-size: 15px;
  font-weight: 600;
  color: #e8ecf4;
  margin-bottom: 4px;
}

#sidebar-header .subtitle {
  font-size: 11px;
  color: #5a6a80;
}

#stats {
  display: flex;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid #1a2332;
}

.stat-box {
  flex: 1;
  text-align: center;
}

.stat-box .num {
  font-size: 22px;
  font-weight: 700;
  color: #00d4ff;
}

.stat-box .label {
  font-size: 9px;
  text-transform: uppercase;
  color: #5a6a80;
  letter-spacing: 1px;
  margin-top: 2px;
}

#layer-nav {
  padding: 10px 20px;
  border-bottom: 1px solid #1a2332;
}

#layer-nav h4 {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #5a6a80;
  margin-bottom: 6px;
}

.layer-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  color: #8a9bb0;
  font-size: 11px;
  font-family: inherit;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s;
}

.layer-btn:hover { background: #131b2e; color: #c8d6e5; }
.layer-btn.active { background: #16203a; color: #00d4ff; }

#category-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

#category-list::-webkit-scrollbar { width: 4px; }
#category-list::-webkit-scrollbar-track { background: transparent; }
#category-list::-webkit-scrollbar-thumb { background: #1a2332; border-radius: 2px; }

.cat-item {
  display: flex;
  align-items: center;
  padding: 6px 20px;
  cursor: pointer;
  transition: background 0.15s;
  gap: 8px;
}

.cat-item:hover { background: #131b2e; }
.cat-item.active { background: #16203a; }

.cat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.cat-name {
  font-size: 12px;
  color: #a0b0c8;
  flex: 1;
}

.cat-item.active .cat-name { color: #e8ecf4; }

.cat-count {
  font-size: 11px;
  color: #5a6a80;
  font-variant-numeric: tabular-nums;
}

#detail-panel {
  border-top: 1px solid #1a2332;
  padding: 16px 20px;
  min-height: 80px;
  max-height: 200px;
  overflow-y: auto;
}

#detail-panel h3 {
  font-size: 13px;
  color: #e8ecf4;
  margin-bottom: 8px;
}

#detail-panel .skill-row {
  font-size: 11px;
  color: #8a9bb0;
  padding: 2px 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- Canvas ---------- */
#canvas-container {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#neural-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(13,19,32,0.95);
  border: 1px solid #1a2332;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 11px;
  color: #e8ecf4;
  max-width: 280px;
  z-index: 100;
  display: none;
  line-height: 1.5;
}

#tooltip .tt-title {
  font-weight: 600;
  color: #00d4ff;
  margin-bottom: 2px;
}

#tooltip .tt-count {
  color: #5a6a80;
  font-size: 10px;
}

#tooltip .tt-layer {
  color: #8a9bb0;
  font-size: 10px;
  margin-top: 2px;
}

#controls {
  position: absolute;
  bottom: 16px;
  left: 16px;
  display: flex;
  gap: 8px;
  z-index: 50;
}

.ctrl-btn {
  background: rgba(13,19,32,0.9);
  border: 1px solid #1a2332;
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 11px;
  color: #8a9bb0;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.ctrl-btn:hover { border-color: #00d4ff; color: #00d4ff; }
.ctrl-btn.active { background: #16203a; border-color: #00d4ff; color: #00d4ff; }

#layer-labels {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 10;
}

.layer-label {
  position: absolute;
  top: 16px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: rgba(90,106,128,0.6);
  white-space: nowrap;
  transform: translateX(-50%);
}

#loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #5a6a80;
  font-size: 14px;
}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>AI Collection Neural Map</h1>
      <div class="subtitle">Layered neural network visualization</div>
    </div>
    <div id="stats">
      <div class="stat-box"><div class="num" id="stat-skills">0</div><div class="label">Skills</div></div>
      <div class="stat-box"><div class="num" id="stat-cats">0</div><div class="label">Nodes</div></div>
      <div class="stat-box"><div class="num" id="stat-conns">0</div><div class="label">Synapses</div></div>
    </div>
    <div id="layer-nav">
      <h4>Layers</h4>
      <button class="layer-btn" data-layer="0">L0 — Input: Data & Foundations</button>
      <button class="layer-btn" data-layer="1">L1 — Hidden: Core Theory</button>
      <button class="layer-btn" data-layer="2">L2 — Hidden: Applied AI</button>
      <button class="layer-btn" data-layer="3">L3 — Hidden: Engineering</button>
      <button class="layer-btn" data-layer="4">L4 — Output: Domains</button>
    </div>
    <div id="category-list"></div>
    <div id="detail-panel">
      <h3 id="detail-title">Hover or click a node</h3>
      <div id="detail-skills"></div>
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvas-container">
    <canvas id="neural-canvas"></canvas>
    <div id="layer-labels"></div>
    <div id="tooltip"><div class="tt-title"></div><div class="tt-count"></div><div class="tt-layer"></div></div>
    <div id="loading">Initializing neural network...</div>
    <div id="controls">
      <button class="ctrl-btn active" id="btn-particles">Signals: On</button>
      <button class="ctrl-btn" id="btn-pause">Pause</button>
      <button class="ctrl-btn" id="btn-zoom-fit">Fit</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// DATA — generated from collection/skills/ directory structure
// ============================================================
const SKILL_DATA = {"categories": [{"name": "other", "count": 2261, "color": "#5a6a80"}, {"name": "neuroscience", "count": 1365, "color": "#e74c3c"}, {"name": "quantum", "count": 960, "color": "#9b59b6"}, {"name": "spiking-neuromorphic", "count": 391, "color": "#e67e22"}, {"name": "general-ml", "count": 257, "color": "#2ecc71"}, {"name": "ai-ml", "count": 224, "color": "#1abc9c"}, {"name": "nlp-llm", "count": 210, "color": "#3498db"}, {"name": "multi-agent-rl", "count": 204, "color": "#f1c40f"}, {"name": "physics-math", "count": 162, "color": "#00bcd4"}, {"name": "signal-control-systems", "count": 162, "color": "#e91e63"}, {"name": "reasoning-bayesian", "count": 82, "color": "#673ab7"}, {"name": "vision-generative", "count": 75, "color": "#ff9800"}, {"name": "ai-safety-eval", "count": 69, "color": "#f44336"}, {"name": "systems-engineering", "count": 67, "color": "#3f51b5"}, {"name": "reinforcement-learning", "count": 62, "color": "#ffc107"}, {"name": "tools-frameworks", "count": 43, "color": "#795548"}, {"name": "software-engineering", "count": 41, "color": "#607d8b"}, {"name": "data-retrieval", "count": 40, "color": "#4caf50"}, {"name": "healthcare-bio", "count": 39, "color": "#8bc34a"}, {"name": "control-systems", "count": 38, "color": "#cddc39"}, {"name": "security-privacy", "count": 26, "color": "#ff5722"}, {"name": "agent-tools", "count": 25, "color": "#607d8b"}, {"name": "deployment-optimization", "count": 22, "color": "#8bc34a"}, {"name": "finance", "count": 22, "color": "#4caf50"}, {"name": "knowledge-graph", "count": 22, "color": "#cddc39"}, {"name": "math-statistics", "count": 18, "color": "#009688"}, {"name": "medical", "count": 10, "color": "#f44336"}, {"name": "memory", "count": 6, "color": "#9c27b0"}, {"name": "continual-learning", "count": 5, "color": "#3f51b5"}, {"name": "information-science", "count": 3, "color": "#607d8b"}, {"name": "chat-history-lancedb", "count": 0, "color": "#455a64"}, {"name": "skill-rag-indexer", "count": 0, "color": "#455a64"}], "total": 6911};

// ============================================================
// NEURAL NETWORK LAYER MAPPING
// 5 layers: Input → Hidden1 → Hidden2 → Hidden3 → Output
// ============================================================
const LAYER_MAP = {
  0: { // Input: Data sources & foundations
    label: "Input: Data & Foundations",
    cats: ["data-retrieval", "math-statistics", "physics-math", "information-science"]
  },
  1: { // Hidden 1: Core theory
    label: "Hidden: Core Theory",
    cats: ["reasoning-bayesian", "general-ml", "quantum", "neuroscience"]
  },
  2: { // Hidden 2: Applied AI
    label: "Hidden: Applied AI",
    cats: ["ai-ml", "nlp-llm", "vision-generative", "multi-agent-rl", "reinforcement-learning", "spiking-neuromorphic", "signal-control-systems"]
  },
  3: { // Hidden 3: Engineering layer
    label: "Hidden: Engineering",
    cats: ["systems-engineering", "software-engineering", "tools-frameworks", "agent-tools", "control-systems", "deployment-optimization", "knowledge-graph", "memory", "continual-learning"]
  },
  4: { // Output: Domain applications
    label: "Output: Domain Applications",
    cats: ["healthcare-bio", "medical", "finance", "ai-safety-eval", "security-privacy", "other"]
  },
};

const LAYER_NAMES = ["L0 Input", "L1 Hidden", "L2 Hidden", "L3 Hidden", "L4 Output"];

// ============================================================
// NETWORK SIMULATION
// ============================================================
const canvas = document.getElementById('neural-canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const loadingEl = document.getElementById('loading');
const layerLabelsEl = document.getElementById('layer-labels');

let W, H;
let nodes = [];
let edges = [];
let particles = [];
let activeCategory = null;
let activeLayer = null;
let paused = false;
let particlesOn = true;
let mouseX = 0, mouseY = 0;
let hoverNode = null;
let camera = { offsetX: 0, offsetY: 0 };

function resize() {
  const container = document.getElementById('canvas-container');
  W = container.clientWidth;
  H = container.clientHeight;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = H * window.devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

function init() {
  resize();
  nodes = [];
  const layerKeys = Object.keys(LAYER_MAP).map(Number).sort((a,b) => a - b);
  const numLayers = layerKeys.length;
  const layerSpacing = W / (numLayers + 1);

  // Position nodes in vertical columns per layer
  layerKeys.forEach(layerIdx => {
    const layer = LAYER_MAP[layerIdx];
    const cats = layer.cats
      .map(name => SKILL_DATA.categories.find(c => c.name === name))
      .filter(c => c && c.count > 0);

    const colX = layerSpacing * (layerIdx + 1);
    const colH = H - 100;
    const startY = (H - colH) / 2 + 20;
    const step = colH / Math.max(cats.length, 1);

    cats.forEach((cat, i) => {
      const y = startY + step * (i + 0.5);
      // Small horizontal jitter for organic feel
      const jitter = (Math.random() - 0.5) * 15;
      const nodeRadius = Math.max(10, Math.min(40, Math.log2(cat.count + 1) * 4.5));
      nodes.push({
        x: colX + jitter,
        y: y,
        vx: 0, vy: 0,
        baseX: colX + jitter,
        baseY: y,
        radius: nodeRadius,
        category: cat.name,
        count: cat.count,
        color: cat.color,
        layer: layerIdx,
        pulse: Math.random() * Math.PI * 2,
        pulseSpeed: 0.015 + Math.random() * 0.02,
        activation: 0, // lights up when signal passes through
      });
    });
  });

  // Build edges: connect each node to nodes in the next layer
  // Sample connections to avoid visual clutter — each node connects
  // to its top-N nearest neighbors in the next layer
  edges = [];
  const layersOfNodes = {};
  nodes.forEach(n => {
    if (!layersOfNodes[n.layer]) layersOfNodes[n.layer] = [];
    layersOfNodes[n.layer].push(n);
  });

  for (let l = 0; l < numLayers - 1; l++) {
    const fromNodes = layersOfNodes[l] || [];
    const toNodes = layersOfNodes[l + 1] || [];
    fromNodes.forEach(fn => {
      // Sort targets by proximity, connect to nearest 2-4
      const maxConn = Math.min(toNodes.length, fn.count > 200 ? 4 : fn.count > 50 ? 3 : 2);
      const sorted = toNodes.map(tn => ({
        node: tn,
        dist: Math.abs(fn.y - tn.y)
      })).sort((a, b) => a.dist - b.dist);

      for (let i = 0; i < maxConn; i++) {
        edges.push({
          from: fn,
          to: sorted[i].node,
          strength: 0.5,
        });
      }
    });
  }

  // Init signal particles flowing left→right
  particles = [];
  edges.forEach((e, i) => {
    const numParticles = Math.max(1, Math.min(3, Math.floor(Math.log2(e.from.count + 1))));
    for (let p = 0; p < numParticles; p++) {
      particles.push({
        edge: i,
        t: Math.random(),
        speed: 0.004 + Math.random() * 0.006,
        size: 1.5 + Math.random() * 1.5,
      });
    }
  });

  // Update stats
  document.getElementById('stat-skills').textContent = SKILL_DATA.total.toLocaleString();
  document.getElementById('stat-cats').textContent = nodes.length;
  document.getElementById('stat-conns').textContent = edges.length;

  loadingEl.style.display = 'none';
  buildSidebar();
  buildLayerLabels(layerKeys, layerSpacing);
}

function buildLayerLabels(layerKeys, layerSpacing) {
  layerLabelsEl.innerHTML = '';
  layerKeys.forEach(idx => {
    const label = document.createElement('div');
    label.className = 'layer-label';
    label.textContent = LAYER_NAMES[idx];
    label.style.left = (layerSpacing * (idx + 1)) + 'px';
    layerLabelsEl.appendChild(label);
  });
}

function buildSidebar() {
  // Group by layer
  const list = document.getElementById('category-list');
  list.innerHTML = '';
  const layerKeys = Object.keys(LAYER_MAP).map(Number).sort((a,b) => a - b);
  layerKeys.forEach(layerIdx => {
    const layer = LAYER_MAP[layerIdx];
    const header = document.createElement('div');
    header.style.cssText = 'padding:8px 20px 4px; font-size:9px; text-transform:uppercase; letter-spacing:1px; color:#3a4a60;';
    header.textContent = LAYER_NAMES[layerIdx];
    list.appendChild(header);

    const cats = layer.cats
      .map(name => SKILL_DATA.categories.find(c => c.name === name))
      .filter(c => c && c.count > 0)
      .sort((a, b) => b.count - a.count);

    cats.forEach(cat => {
      const item = document.createElement('div');
      item.className = 'cat-item';
      item.dataset.category = cat.name;
      item.innerHTML = `
        <div class="cat-dot" style="background:${cat.color}"></div>
        <div class="cat-name">${cat.name}</div>
        <div class="cat-count">${cat.count}</div>
      `;
      item.addEventListener('click', () => {
        activeCategory = activeCategory === cat.name ? null : cat.name;
        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
        if (activeCategory) {
          item.classList.add('active');
          showDetails(cat, layerIdx);
        } else {
          document.getElementById('detail-title').textContent = 'Hover or click a node';
          document.getElementById('detail-skills').innerHTML = '';
        }
      });
      list.appendChild(item);
    });
  });
}

function showDetails(cat, layerIdx) {
  document.getElementById('detail-title').textContent = cat.name + ' — ' + cat.count + ' skills';
  const detail = document.getElementById('detail-skills');
  detail.innerHTML = '<div class="skill-row" style="color:#5a6a80">Layer ' + layerIdx + ' · collection/skills/' + cat.name + '/</div>';
}

// ============================================================
// ANIMATION LOOP
// ============================================================
function update() {
  if (paused) return;

  // Gentle floating motion around base position
  for (let n of nodes) {
    const dx = n.baseX - n.x;
    const dy = n.baseY - n.y;
    n.vx += dx * 0.005;
    n.vy += dy * 0.005;
    n.vx *= 0.9;
    n.vy *= 0.9;
    n.x += n.vx;
    n.y += n.vy;
    n.pulse += n.pulseSpeed;

    // Decay activation
    n.activation *= 0.95;
  }

  // Update signal particles flowing left→right
  if (particlesOn) {
    for (let p of particles) {
      p.t += p.speed;
      if (p.t > 1) {
        p.t = 0;
        // Activate target node when signal arrives
        edges[p.edge].to.activation = Math.min(1, edges[p.edge].to.activation + 0.3);
      }
      // Also activate source node slightly
      if (p.t < 0.05) {
        edges[p.edge].from.activation = Math.min(1, edges[p.edge].from.activation + 0.1);
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Subtle background grid
  ctx.strokeStyle = 'rgba(20,30,48,0.2)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 50) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Draw layer separators (vertical bands)
  const numLayers = Object.keys(LAYER_MAP).length;
  const layerSpacing = W / (numLayers + 1);
  for (let l = 0; l <= numLayers; l++) {
    const x = layerSpacing * l + (l === 0 ? 0 : layerSpacing * 0.5);
    if (l > 0 && l < numLayers) {
      ctx.fillStyle = 'rgba(15,22,38,0.3)';
      ctx.fillRect(x - layerSpacing * 0.5, 0, layerSpacing, H);
    }
  }

  // Draw synapses (edges)
  for (let e of edges) {
    const isActive = activeCategory && (e.from.category === activeCategory || e.to.category === activeCategory);
    const isLayerActive = activeLayer !== null && (e.from.layer === activeLayer || e.to.layer === activeLayer);
    const dim = (activeCategory && !isActive) || (activeLayer !== null && !isLayerActive);

    ctx.strokeStyle = dim
      ? 'rgba(25,35,55,0.08)'
      : isActive
        ? `rgba(0,212,255,${0.35 + e.from.activation * 0.3})`
        : `rgba(40,60,90,${0.12 + e.from.activation * 0.15})`;
    ctx.lineWidth = isActive ? 1.5 : 0.6;
    ctx.beginPath();
    ctx.moveTo(e.from.x, e.from.y);
    ctx.lineTo(e.to.x, e.to.y);
    ctx.stroke();
  }

  // Draw signal particles
  if (particlesOn) {
    for (let p of particles) {
      const e = edges[p.edge];
      if (!e) continue;
      const isActive = activeCategory && (e.from.category === activeCategory || e.to.category === activeCategory);
      const isLayerActive = activeLayer !== null && (e.from.layer === activeLayer || e.to.layer === activeLayer);
      const dim = (activeCategory && !isActive) || (activeLayer !== null && !isLayerActive);
      if (dim) continue;

      const px = e.from.x + (e.to.x - e.from.x) * p.t;
      const py = e.from.y + (e.to.y - e.from.y) * p.t;

      // Particle glow
      ctx.fillStyle = isActive ? 'rgba(0,212,255,0.2)' : 'rgba(0,200,255,0.12)';
      ctx.beginPath();
      ctx.arc(px, py, p.size * 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Particle core
      ctx.fillStyle = isActive ? '#00d4ff' : 'rgba(120,220,255,0.8)';
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Draw neurons (nodes)
  for (let n of nodes) {
    const isActive = activeCategory === n.category;
    const isLayerActive = activeLayer === n.layer;
    const isRelated = activeCategory && edges.some(e =>
      (e.from === n && e.to.category === activeCategory) ||
      (e.to === n && e.from.category === activeCategory)
    );
    const dim = (activeCategory && !isActive && !isRelated) || (activeLayer !== null && !isLayerActive);

    const pulseR = n.radius + Math.sin(n.pulse) * 1.5;
    const actBoost = n.activation * 5;
    const r = Math.max(4, pulseR + actBoost);

    // Outer glow
    const glowAlpha = dim ? 0.03 : (isActive ? 0.35 : 0.1 + n.activation * 0.2);
    const grad = ctx.createRadialGradient(n.x, n.y, r * 0.5, n.x, n.y, r * 2.8);
    const alphaHex = Math.floor(glowAlpha * 255).toString(16).padStart(2, '0');
    grad.addColorStop(0, n.color + alphaHex);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r * 2.8, 0, Math.PI * 2);
    ctx.fill();

    // Node body — neuron circle
    ctx.fillStyle = dim ? '#1a2332' : n.color;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Inner highlight (3D effect)
    if (!dim) {
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.arc(n.x - r * 0.3, n.y - r * 0.3, r * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }

    // Ring (active state)
    ctx.strokeStyle = isActive ? '#00d4ff' : (dim ? '#1a2332' : 'rgba(255,255,255,0.12)');
    ctx.lineWidth = isActive ? 2.5 : 1;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.stroke();

    // Activation ring (lights up when signal passes)
    if (n.activation > 0.1 && !dim) {
      ctx.strokeStyle = `rgba(0,212,255,${n.activation * 0.6})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 4 + n.activation * 3, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Label
    if (!dim || isActive) {
      ctx.font = `${isActive ? 'bold ' : ''}10px 'SF Mono', monospace`;
      ctx.fillStyle = isActive ? '#00d4ff' : 'rgba(200,214,229,0.65)';
      ctx.textAlign = 'center';
      ctx.fillText(n.category, n.x, n.y - r - 6);

      ctx.font = '9px monospace';
      ctx.fillStyle = 'rgba(90,106,128,0.8)';
      ctx.fillText(n.count, n.x, n.y + 3);
    }
  }

  // Hover detection
  hoverNode = null;
  for (let n of nodes) {
    const dx = mouseX - n.x;
    const dy = mouseY - n.y;
    if (Math.sqrt(dx * dx + dy * dy) < n.radius + 5) {
      hoverNode = n;
      break;
    }
  }

  if (hoverNode) {
    canvas.style.cursor = 'pointer';
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(mouseX + 15, W - 200) + 'px';
    tooltip.style.top = Math.max(mouseY - 10, 0) + 'px';
    tooltip.querySelector('.tt-title').textContent = hoverNode.category;
    tooltip.querySelector('.tt-count').textContent = hoverNode.count + ' skills';
    tooltip.querySelector('.tt-layer').textContent = 'Layer ' + hoverNode.layer + ' · ' + LAYER_NAMES[hoverNode.layer];
  } else {
    canvas.style.cursor = 'default';
    tooltip.style.display = 'none';
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
// INTERACTION
// ============================================================
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});

canvas.addEventListener('click', () => {
  if (hoverNode) {
    activeCategory = activeCategory === hoverNode.category ? null : hoverNode.category;
    document.querySelectorAll('.cat-item').forEach(el => {
      el.classList.toggle('active', el.dataset.category === activeCategory);
    });
    if (activeCategory) {
      const cat = SKILL_DATA.categories.find(c => c.name === activeCategory);
      if (cat) showDetails(cat, hoverNode.layer);
    } else {
      document.getElementById('detail-title').textContent = 'Hover or click a node';
      document.getElementById('detail-skills').innerHTML = '';
    }
  }
});

// Layer navigation buttons
document.querySelectorAll('.layer-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const layer = parseInt(btn.dataset.layer);
    activeLayer = activeLayer === layer ? null : layer;
    document.querySelectorAll('.layer-btn').forEach(el => el.classList.remove('active'));
    if (activeLayer !== null) btn.classList.add('active');
  });
});

document.getElementById('btn-particles').addEventListener('click', function() {
  particlesOn = !particlesOn;
  this.textContent = 'Signals: ' + (particlesOn ? 'On' : 'Off');
  this.classList.toggle('active', particlesOn);
});

document.getElementById('btn-pause').addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? 'Play' : 'Pause';
  this.classList.toggle('active', paused);
});

document.getElementById('btn-zoom-fit').addEventListener('click', () => {
  activeCategory = null;
  activeLayer = null;
  document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.layer-btn').forEach(el => el.classList.remove('active'));
  // Reset positions
  nodes.forEach(n => {
    n.x = n.baseX;
    n.y = n.baseY;
    n.vx = 0;
    n.vy = 0;
  });
});

window.addEventListener('resize', () => {
  resize();
  // Recalculate positions
  const layerKeys = Object.keys(LAYER_MAP).map(Number).sort((a,b) => a - b);
  const numLayers = layerKeys.length;
  const layerSpacing = W / (numLayers + 1);

  layerKeys.forEach(layerIdx => {
    const layer = LAYER_MAP[layerIdx];
    const cats = layer.cats
      .map(name => nodes.find(n => n.category === name))
      .filter(n => n);
    const colX = layerSpacing * (layerIdx + 1);
    const colH = H - 100;
    const startY = (H - colH) / 2 + 20;
    const step = colH / Math.max(cats.length, 1);
    cats.forEach((n, i) => {
      n.baseX = colX;
      n.baseY = startY + step * (i + 0.5);
    });
  });
  buildLayerLabels(layerKeys, layerSpacing);
});

// Start
init();
loop();
</script>
</body>
</html>
